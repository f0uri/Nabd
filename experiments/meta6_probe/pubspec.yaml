name: meta6_probe
description: Isolated Android reachability and Meta Page text transport experiment.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  dio: 5.9.0
  flutter_riverpod: 2.6.1
  sqflite: 2.4.2
  path: 1.9.1
  path_provider: 2.1.5
  flutter_secure_storage: 9.2.4
  flutter_local_notifications: 19.4.2
  workmanager: 0.9.0+3
  # Keep the federated implementations aligned with this tested interface.
  # Newer compatible-range releases added arguments the old Apple side lacks.
  workmanager_android: 0.9.0+2
  workmanager_apple: 0.9.1+2
  workmanager_platform_interface: 0.9.1+1
dev_dependencies:
  sqflite_common_ffi: 2.3.6
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
