<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>نبض — الملف الشخصي (v2)</title>
<style>
  /* «+» صغيرة فاسفل الصورة من الداخل */
  .plusbadge{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:22px;height:22px;
    border-radius:50%;background:var(--brand);border:2px solid #fff;color:#fff;font-size:15px;font-weight:800;
    line-height:1;display:grid;place-items:center;box-shadow:0 1px 4px rgba(0,0,0,.18);pointer-events:none}

  .avph{position:relative;display:block;flex:none;border-radius:50%;background:#E7EAEE;overflow:hidden}
  .avph::before{content:"";position:absolute;top:16%;left:50%;transform:translateX(-50%);width:36%;height:36%;border-radius:50%;background:#BEC2C6}
  .avph::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:68%;height:38%;border-radius:50% 50% 0 0 / 70% 70% 0 0;background:#BEC2C6}

  :root{
    --brand:#1877F2; --brand-dark:#0C63D4; --brand-soft:#E7F3FF;
    --canvas:#F0F2F5; --surface:#FFF; --text:#050505; --text2:#65676B; --text3:#8A8D91;
    --divider:#CED0D4; --hairline:#E4E6EB; --danger:#E41E3F; --success:#31A24C;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,sans-serif;
    --sh:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;background:#0F1420;color:#E7ECF3;font-family:var(--font);padding:34px 20px 60px}
  .head{max-width:1560px;margin:0 auto 26px;text-align:center}
  .kicker{font-size:11px;font-weight:700;color:#60A5FA;letter-spacing:1.2px}
  h1{font-size:25px;margin:6px 0 8px;color:#fff;font-weight:800}
  .head p{margin:0;color:#98A2B3;font-size:13.5px;line-height:1.8}
  .row{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;max-width:1620px;margin:0 auto}
  .col{width:330px}
  .caption{text-align:center;font-size:12.5px;color:#98A2B3;margin-top:14px;line-height:1.7}
  .caption b{color:#E7ECF3;display:block;font-size:13.5px;margin-bottom:3px}

  .phone{width:330px;height:700px;background:#000;border-radius:46px;padding:9px;position:relative;overflow:hidden;
    box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1.5px #2B2B2E,0 0 0 5px #0B0E14}
  .screen{width:100%;height:100%;background:var(--canvas);border-radius:38px;overflow:hidden;display:flex;flex-direction:column;color:var(--text)}
  .notch{position:absolute;top:19px;left:50%;transform:translateX(-50%);width:92px;height:23px;background:#000;border-radius:99px;z-index:50}
  .statusbar{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:12px;font-weight:600;background:var(--surface);direction:ltr}
  .sb-icons{display:flex;gap:4px;align-items:center}
  .sb-icons svg{width:15px;height:10px}
  .appbar{height:50px;flex:none;background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:.5px solid var(--hairline);z-index:5}
  .brand{display:flex;align-items:center;gap:7px}
  .logo{width:27px;height:27px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px}
  .brandname{font-size:17px;font-weight:800;color:var(--brand)}
  .iconrow{display:flex;gap:6px}
  .icbtn{width:32px;height:32px;border-radius:50%;background:var(--hairline);display:grid;place-items:center;position:relative}
  .icbtn svg{width:17px;height:17px}
  .badge{position:absolute;top:-3px;left:-3px;min-width:16px;height:16px;padding:0 4px;background:var(--danger);color:#fff;border-radius:99px;font-size:9.5px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}

  .body{flex:1;overflow-y:auto;padding-bottom:12px}
  .av{border-radius:50%;overflow:hidden;flex:none;display:block;object-fit:cover}
  .av svg{width:100%;height:100%;display:block}

  /* ====== الغلاف ====== */
  .cover{height:146px;background:var(--brand-dark);position:relative;overflow:hidden}
  .cover .c1{position:absolute;width:230px;height:230px;border-radius:50%;background:rgba(255,255,255,.08);top:-110px;right:-50px}
  .cover .c2{position:absolute;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.10);bottom:-64px;left:34px}
  

  /* ====== رأس الملف ====== */
  .pheadcard{background:#fff;box-shadow:var(--sh)}
  .pheadrow{display:flex;align-items:flex-start;gap:11px;padding:0 14px;position:relative;z-index:2}
  .avatar-ring{padding:4px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);margin-top:-34px;flex:none;position:relative}
  .phtext{flex:1;padding-top:9px;padding-bottom:4px;min-width:0}
  .pname{font-size:17px;font-weight:800;display:flex;align-items:center;gap:4px}
  .pname svg{width:14px;height:14px;color:var(--brand)}
  .pmeta{font-size:11px;color:var(--text2);margin-top:2px}
  .pbio-inline{font-size:10.5px;line-height:16px;color:var(--text2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .pacts{display:flex;gap:7px;padding:0 14px;margin-top:9px}
  .pact{height:33px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:5px;font-size:11.5px;font-weight:700}
  .pact svg{width:14px;height:14px}
  .pact.pri{flex:1;background:var(--brand);color:#fff}
  .pact.sec{flex:1;background:var(--hairline);color:var(--text)}
  .pact.ico{width:38px;background:var(--hairline);color:var(--text)}

  /* ====== التبويبات ====== */
  .ptabs{display:flex;gap:0;border-top:.5px solid var(--divider);margin-top:9px;overflow-x:auto;scrollbar-width:none}
  .ptabs::-webkit-scrollbar{display:none}
  .ptab{position:relative;padding:11px 15px;font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap}
  .ptab.on{color:var(--brand)}
  .ptab.on::after{content:"";position:absolute;bottom:0;right:9px;left:9px;height:3px;background:var(--brand);border-radius:3px}

  /* ====== بطاقات ====== */
  .listcard{background:#fff;margin:8px;border-radius:12px;padding:14px;box-shadow:var(--sh)}
  .listtitle{font-size:14px;font-weight:700;margin-bottom:6px}
  .inforow{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:.5px solid var(--hairline)}
  .inforow:last-child{border:0}
  .inforow svg{width:19px;height:19px;color:var(--text2);flex:none;margin-top:2px}
  .ilabel{font-size:10.5px;color:var(--text2)}
  .ivalue{font-size:12px;margin-top:1px}
  .frow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:.5px solid var(--hairline)}
  .frow:last-child{border:0}
  .fname{font-size:12px;font-weight:600}
  .fmeta{font-size:10.5px;color:var(--text2);margin-top:1px}

  .postcard{background:#fff;padding:11px 14px;margin-bottom:8px}
  .posthead{display:flex;gap:8px;align-items:center}
  .ptext{font-size:12px;line-height:19px;margin:9px 0 0;padding-bottom:8px}
  .psum{display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--text2);padding-top:7px;border-top:.5px solid var(--divider)}
  .rxstack{display:flex;align-items:center;gap:4px}
  .rx{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:#fff;border:1.5px solid #fff}
  .rx svg{width:9px;height:9px}
  .rx.like{background:#1877F2}.rx.love{background:#F33E58}

  .grid{display:flex;flex-wrap:wrap;gap:2px;padding:2px}
  .gcell{width:32.6%;aspect-ratio:1;background:#DCE3EC;display:grid;place-items:center;border-radius:2px;color:#8A93A3}
  .gcell svg{width:20px;height:20px}
  .gcell.sun{background:linear-gradient(160deg,#2B1B57,#EE8A4A)}
  .gcell.coffee{background:linear-gradient(160deg,#C99A6B,#6B3B1F)}

  .tabbar{height:60px;flex:none;background:#fff;border-top:.5px solid var(--divider);display:flex;align-items:center;justify-content:space-around;padding:0 4px}
  .tab{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text2);font-size:9.5px;width:58px;position:relative}
  .tab svg{width:21px;height:21px}
  .tab.on{color:var(--brand);font-weight:700}
  .tab.on::after{content:"";position:absolute;bottom:-8px;width:20px;height:2.5px;background:var(--brand);border-radius:3px}
</style>
</head>
<body>

<div class="head">
  <div class="kicker">NABD · PROFILE v2</div>
  <h1>الملف الشخصي — التصميم الجديد</h1>
  <p>غلاف · صورة رمزية متراكبة (سيلويت افتراضي إلا ماكانتش صورة) · اسم ونبذة · أزرار إجراءات · تبويبات (المنشورات · حول · الأصدقاء · الصور)</p>
  <p style="margin:6px 0 0;color:#6E82A0;font-size:11.5px">بلا صورة = السيلويت الرمادي الافتراضي (بحال فيسبوك) · صاحب الحساب هو اللي كيرفع صورتو من عندو</p>

<div class="row" id="row"></div>

<script>
const TABS = [['posts','المنشورات'],['about','حول'],['friends','الأصدقاء'],['photos','الصور']];

const av = (ref, s) => `<span class="av avph" style="width:${s}px;height:${s}px"></span>`;

function tabsHTML(active){
  return `<div class="ptabs">${TABS.map(([k,l])=>`<div class="ptab ${k===active?'on':''}">${l}</div>`).join('')}</div>`;
}

function headHTML(active){
  return `
  <div class="cover"><div class="c1"></div><div class="c2"></div></div>
  <div class="pheadcard">
    <div class="pheadrow">
      <div class="avatar-ring">${av('p-me',76)}<div class="plusbadge">+</div></div>
      <div class="phtext">
        <div class="pname">يوسف بنعلي <svg><use href="#i-verified"/></svg></div>
        <div class="pmeta">2 صديق · 3 منشور</div>
        <div class="pbio-inline">مبرمج موبايل · مراكش — كنبني تطبيقات بـ React Native.</div>
      </div>
    </div>
    <div class="pacts">
      <div class="pact pri"><svg><use href="#i-edit"/></svg> تعديل الملف</div>
      <div class="pact sec"><svg><use href="#i-plus-circle"/></svg> ستوري</div>
      <div class="pact ico"><svg><use href="#i-logout"/></svg></div>
    </div>
    ${tabsHTML(active)}
  </div>`;
}

const post = (time,text) => `
  <div class="postcard">
    <div class="posthead">
      ${av('p-me',36)}
      <div><div style="font-size:12px;font-weight:600">يوسف بنعلي</div><div style="font-size:10px;color:var(--text2)">${time}</div></div>
    </div>
    <p class="ptext">${text}</p>
    <div class="psum">
      <div class="rxstack">
        <span class="rx like"><svg><use href="#i-thumb-fill"/></svg></span>
        <span class="rx love"><svg><use href="#i-heart-fill"/></svg></span>
        <span>42</span>
      </div>
      <span>15 تعليق · 0 مشاركة</span>
    </div>
  </div>`;

const content = {
  posts: () => post('قبل 43 دقيقة','شكون جرّب يطلع لتامادوت الفجر؟ بغيت نمشي هاد السيمانة ونحتاج نصائح على الطريق والجو.')
              + post('أمس','جربت رفع صورة من التطبيق لسحابة تلغرام، كلشي خدم من أول مرة.'),
  about: () => `
    <div class="listcard">
      <div class="listtitle">المعلومات</div>
      <div class="inforow"><svg><use href="#i-doc"/></svg><div><div class="ilabel">النبذة</div><div class="ivalue">مبرمج موبايل · مراكش</div></div></div>
      <div class="inforow"><svg><use href="#i-mail"/></svg><div><div class="ilabel">البريد</div><div class="ivalue">youssef@nabd.app</div></div></div>
      <div class="inforow"><svg><use href="#i-users"/></svg><div><div class="ilabel">الأصدقاء</div><div class="ivalue">2 صديق</div></div></div>
      <div class="inforow"><svg><use href="#i-calendar"/></svg><div><div class="ilabel">عضو منذ</div><div class="ivalue">2026</div></div></div>
      <div class="inforow"><svg><use href="#i-globe"/></svg><div><div class="ilabel">الخصوصية</div><div class="ivalue">الملف مرئي للجميع</div></div></div>
    </div>`,
  friends: () => `
    <div class="listcard">
      <div class="listtitle">الأصدقاء</div>
      ${[['p-1','سارة العمراني','2 صديق'],['p-3','هند الإدريسي','1 صديق'],['p-4','مراد الشرقاوي','1 صديق']]
        .map(([a,n,m])=>`<div class="frow">${av(a,40)}<div style="flex:1"><div class="fname">${n}</div><div class="fmeta">${m}</div></div><svg style="width:16px;height:16px;color:#8A8D91"><use href="#i-users"/></svg></div>`).join('')}
    </div>`,
  photos: () => `
    <div class="grid">
      <div class="gcell sun"></div><div class="gcell coffee"></div>
      <div class="gcell"><svg><use href="#i-image"/></svg></div>
      <div class="gcell"><svg><use href="#i-image"/></svg></div>
      <div class="gcell sun" style="opacity:.75"></div>
    </div>`
