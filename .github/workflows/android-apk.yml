name: Android APK

on:
  workflow_dispatch:
    inputs:
      inspect_run_id:
        description: 'Optional failed run: report only fixed native probe markers, no build'
        required: false
        type: string
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
      - '.github/workflows/ota-updates.yml'

permissions:
  contents: read

jobs:
  apk:
    if: (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && inputs.inspect_run_id == ''
    outputs:
      runtime: ${{ steps.runtime.outputs.runtime }}
      source: ${{ steps.compact-reuse.outputs.source }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPO_EAS_PROJECT_ID: ${{ vars.EXPO_EAS_PROJECT_ID }}
      EXPO_PUBLIC_API_URL: ${{ vars.NABD_API_URL || 'http://localhost:4000/graphql' }}
      EXPO_PUBLIC_DATA_SOURCE: ${{ vars.NABD_DATA_SOURCE || vars.EXPO_PUBLIC_DATA_SOURCE || 'auto' }}
      # Direct mode intentionally ships an extractable shared bot token.
      EXPO_PUBLIC_TELEGRAM_BOT_TOKEN: ${{ (vars.NABD_DATA_SOURCE || vars.EXPO_PUBLIC_DATA_SOURCE) == 'telegram' && (secrets.NABD_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.EXPO_PUBLIC_TELEGRAM_BOT_TOKEN) || '' }}
      EXPO_PUBLIC_TELEGRAM_CHAT_ID: ${{ (vars.NABD_DATA_SOURCE || vars.EXPO_PUBLIC_DATA_SOURCE) == 'telegram' && (vars.NABD_TELEGRAM_CHAT_ID || secrets.NABD_TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID || secrets.EXPO_PUBLIC_TELEGRAM_CHAT_ID) || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find identical compact build candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SOURCE=ab49a3d8b9739056e4af9b72c26c4195853a0eb7
          git diff --name-only "$SOURCE" "$GITHUB_SHA" > "$RUNNER_TEMP/nabd-compact-diff.txt"
          if git merge-base --is-ancestor "$SOURCE" "$GITHUB_SHA" && ! grep -vE '^(\.github/workflows/|mobile/scripts/|mobile/tests/|docs/)' "$RUNNER_TEMP/nabd-compact-diff.txt"; then
            AVAILABLE=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/41336289110/artifacts" --jq '.artifacts[] | select(.name == "nabd-test-apk" and .expired == false) | .id')
            if [ -n "$AVAILABLE" ]; then echo 'run=41336289110' >> "$GITHUB_OUTPUT"; fi
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu 24.04 image includes Android SDK and accepted licenses.
      # Avoid the extra SDK download in setup-android (the failing step).
      - name: Verify preinstalled Android SDK
        run: |
          test -d "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Validate selected data source
        working-directory: mobile
        run: node scripts/validate-data-source.cjs

      - name: Check TypeScript
        working-directory: mobile
        run: npm run typecheck

      - name: Update and navigation tests
        working-directory: mobile
        # Tests use fixtures, never the real bot credentials of the APK build.
        # Step-scoped values do not affect later prebuild/Gradle steps.
        env:
          EXPO_PUBLIC_DATA_SOURCE: telegram
          EXPO_PUBLIC_TELEGRAM_BOT_TOKEN: '123456:synthetic_fixture_token_for_tests'
          EXPO_PUBLIC_TELEGRAM_CHAT_ID: '-1001234567890'
        run: |
          npm run test:updates
          npm run test:navigation
          node --test tests/profile.test.cjs tests/telegram.test.cjs tests/deployment-audit.test.cjs tests/login-performance.test.cjs tests/native-password.test.cjs tests/full-auth-layout.test.cjs tests/apk-reuse.test.cjs tests/compact-build.test.cjs tests/midnight-ui.test.cjs

      - name: Explain OTA configuration
        working-directory: mobile
        run: |
          node - <<'NODE'
          const config = require('./app.config.js')();
          if (!config.updates.enabled) console.log('::warning::OTA is disabled in this APK until a real Expo project is linked and a new APK is built.');
          NODE

      - name: Generate Android project
        working-directory: mobile
        run: |
          npx expo prebuild --platform android --no-install --clean
          node scripts/check-compact-build.cjs

      - name: Capture canonical Android runtime before Gradle
        id: runtime
        working-directory: mobile
        run: |
          node scripts/capture-android-runtime.cjs "$RUNNER_TEMP/nabd-runtime.json"
          echo "runtime=$(jq -r .runtime "$RUNNER_TEMP/nabd-runtime.json")" >> "$GITHUB_OUTPUT"

      - name: Download identical compact candidate
        if: steps.candidate.outputs.run != ''
        uses: actions/download-artifact@v4
        with:
          name: nabd-test-apk
          run-id: ${{ steps.candidate.outputs.run }}
          github-token: ${{ github.token }}
          path: mobile/android/app/build/outputs/apk/release

      - name: Verify compact candidate runtime and embedded public configuration
        id: compact-reuse
        run: python3 mobile/scripts/reuse-compact-apks.py

      - name: Build compact ABI APKs (R8 + resource shrinking + compressed libraries)
        if: steps.compact-reuse.outputs.reuse != 'true'
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2

      - name: Maximize ZIP compression without changing code or signing identity
        if: steps.compact-reuse.outputs.reuse != 'true'
        working-directory: mobile
        run: python3 scripts/compress-apks.py

      - name: Verify actual APK runtime matches OTA native inputs
        working-directory: mobile
        run: node scripts/verify-apk-runtime.cjs android/app/build/outputs/apk/release "$RUNNER_TEMP/nabd-runtime.json"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: nabd-test-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error


  verify:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      EXPECTED_APK_RUNTIME: ${{ needs.apk.outputs.runtime }}
      APK_SOURCE_SHA: ${{ needs.apk.outputs.source }}
      EXPECTED_APK_ABI: x86_64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: nabd-test-apk
          path: apk
      - name: Enable hardware acceleration for actual Android smoke test
        run: sudo chmod 666 /dev/kvm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Verify native password worker on an actual Android emulator
        # Calls smoke-android-apk.sh: exact same native known-answer publication gate.
        timeout-minutes: 10
        run: bash mobile/scripts/run-native-emulator.sh apk/app-x86_64-release.apk

      - name: Download original APK for size and upgrade-signature comparison
        uses: actions/download-artifact@v4
        with:
          name: nabd-test-apk
          run-id: 41335058126
          github-token: ${{ github.token }}
          path: baseline

      - name: Verify both compact phone APKs and unchanged signing certificate
        run: python3 mobile/scripts/verify-compact-apks.py apk baseline/app-release.apk

      - name: Save native verification and actual Midnight startup screenshot
        uses: actions/upload-artifact@v4
        with:
          name: nabd-native-verification
          path: |
            ${{ runner.temp }}/nabd-compact-proof.json
            ${{ runner.temp }}/nabd-midnight-startup.png
            ${{ runner.temp }}/nabd-midnight-ui-proof.json
          if-no-files-found: error

      - name: Publish verified compact APK download links
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash mobile/scripts/publish-compact-apks.sh

  inspect:
    if: github.event_name == 'pull_request' || inputs.inspect_run_id != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Test launcher and resource inspection (offline, not native proof)
        run: python3 -m unittest discover -s mobile/tests -p 'test_*.py'
      - name: Inspect compact candidate sizes and digests only
        uses: actions/download-artifact@v4
        with:
          name: nabd-test-apk
          run-id: 41336289110
          github-token: ${{ github.token }}
          path: compact-candidate
      - name: Report candidate metadata (not publication proof)
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,pathlib
          for p in sorted(pathlib.Path('compact-candidate').glob('*.apk')):
              print('::notice title=Compact candidate metadata::'+json.dumps(dict(file=p.name,size=p.stat().st_size,sha256=hashlib.sha256(p.read_bytes()).hexdigest())))
          PYCODE
      - name: Inspect original signing baseline
        uses: actions/download-artifact@v4
        with:
          name: nabd-test-apk
          run-id: 41335058126
          github-token: ${{ github.token }}
          path: original-candidate
      - name: Verify SDK certificate format and unchanged candidate key
        run: |
          python3 - <<'PYCODE'
          import importlib.util,pathlib
          spec=importlib.util.spec_from_file_location('compact', 'mobile/scripts/verify-compact-apks.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          baseline=pathlib.Path('original-candidate/app-release.apk')
          assert module.sha(baseline)==module.BASELINE_SHA256
          cert=module.signing_certificate(baseline)
          for apk in pathlib.Path('compact-candidate').glob('*.apk'):
              assert module.signing_certificate(apk)==cert, 'Candidate signing certificate changed'
          PYCODE
      - name: Inspect fixed native markers only
        env:
          GH_TOKEN: ${{ github.token }}
          INSPECT_RUN_ID: ${{ inputs.inspect_run_id }}
        run: |
          if [ -z "$INSPECT_RUN_ID" ]; then
            INSPECT_RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow android-apk.yml --branch main --status failure --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          fi
          if [ -z "$INSPECT_RUN_ID" ]; then exit 0; fi
          [[ "$INSPECT_RUN_ID" =~ ^[0-9]+$ ]]
          gh run view "$INSPECT_RUN_ID" --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/failed.log"
          python3 - <<'PYCODE'
          import os,re,pathlib
          text=pathlib.Path(os.environ['RUNNER_TEMP'],'failed.log').read_text(errors='replace')
          markers=sorted(set(re.findall(r'NABD_NATIVE_CRYPTO_(?:UNAVAILABLE|SELF_TEST_FAILED|SELF_TEST_OK)',text)))
          print('::notice title=Prior native log markers::'+(', '.join(markers) if markers else 'No native log markers were forwarded by this release build.'))
          for line in text.splitlines():
            if re.search(r'adbd cannot|adb:|INSTALL_FAILED|No such file|Permission denied|cannot run as root|[Ee]rror|[Ff]ailed|[Kk]illed|system-images|sdkmanager|emulator.*(?:exit|crash)|not found',line,re.IGNORECASE):
              clean=re.sub(r'https?://\S+', '[url]',line)
              clean=re.sub(r'\d{5,}:[A-Za-z0-9_-]{15,}', '[redacted]',clean)
              clean=clean[:1000].replace('%','%25').replace('\r','%0D').replace('\n','%0A')
              print('::notice title=Prior emulator tooling diagnostic::'+clean)

          PYCODE
