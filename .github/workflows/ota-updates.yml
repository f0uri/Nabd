name: App updates (OTA)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'server/**'
      - '.github/workflows/ota-updates.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'server/**'
      - '.github/workflows/ota-updates.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ota-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      project-id: ${{ steps.project.outputs.id }}
    env:
      EXPO_EAS_PROJECT_ID: ${{ vars.EXPO_EAS_PROJECT_ID }}
      EXPO_PUBLIC_API_URL: ${{ vars.NABD_API_URL || 'http://localhost:4000/graphql' }}
      EXPO_PUBLIC_DATA_SOURCE: ${{ vars.NABD_DATA_SOURCE || vars.EXPO_PUBLIC_DATA_SOURCE || 'auto' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - name: Install server test dependencies
        run: npm ci
        working-directory: server
      - name: Validate server accounts and existing session features
        run: node --test tests/*.test.js
        working-directory: server
      - name: Validate application
        working-directory: mobile
        run: |
          npm run typecheck
          npm run test:updates
          npm run test:navigation
          node --test tests/profile.test.cjs tests/telegram.test.cjs tests/deployment-audit.test.cjs tests/release-publication.test.cjs tests/chat.test.cjs tests/login-performance.test.cjs tests/native-password.test.cjs tests/full-auth-layout.test.cjs tests/apk-reuse.test.cjs
          npx expo export --platform android
          node scripts/verify-release-bundle.cjs
      - name: Regress config tests with an inherited Telegram fixture environment
        working-directory: mobile
        env:
          EXPO_PUBLIC_DATA_SOURCE: telegram
          EXPO_PUBLIC_TELEGRAM_BOT_TOKEN: '123456:synthetic_fixture_token_for_tests'
          EXPO_PUBLIC_TELEGRAM_CHAT_ID: '-1001234567890'
        run: node --test --test-name-pattern='publication validation' tests/telegram.test.cjs
      - name: Check pre-icon OTA native compatibility without publishing
        working-directory: mobile
        run: node scripts/publish-legacy-update.cjs --check
      - name: Resolve linked Expo project
        id: project
        working-directory: mobile
        run: |
          node - <<'NODE'
          const config = require('./app.config.js')();
          const id = config.extra?.eas?.projectId || '';
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT, `id=${id}\n`);
          if (!id) require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'OTA is disabled: link a real Expo project and build an OTA-enabled APK.\n');
          NODE

  publish:
    needs: validate
    # Never expose publication credentials to a pull request or publish an unmerged branch.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.validate.outputs.project-id != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_EAS_PROJECT_ID: ${{ needs.validate.outputs.project-id }}
      EXPO_PUBLIC_API_URL: ${{ vars.NABD_API_URL || 'http://localhost:4000/graphql' }}
      EXPO_PUBLIC_DATA_SOURCE: ${{ vars.NABD_DATA_SOURCE || vars.EXPO_PUBLIC_DATA_SOURCE || 'auto' }}
      # This token is PUBLIC in the compiled app. Secrets only avoids printing it in logs.
      EXPO_PUBLIC_TELEGRAM_BOT_TOKEN: ${{ (vars.NABD_DATA_SOURCE || vars.EXPO_PUBLIC_DATA_SOURCE) == 'telegram' && (secrets.NABD_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.EXPO_PUBLIC_TELEGRAM_BOT_TOKEN) || '' }}
      EXPO_PUBLIC_TELEGRAM_CHAT_ID: ${{ (vars.NABD_DATA_SOURCE || vars.EXPO_PUBLIC_DATA_SOURCE) == 'telegram' && (vars.NABD_TELEGRAM_CHAT_ID || secrets.NABD_TELEGRAM_CHAT_ID || vars.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_ID || secrets.EXPO_PUBLIC_TELEGRAM_CHAT_ID) || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Require publication credentials
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo '::error::Set the EXPO_TOKEN repository secret. Do not put it in the app or source code.'
            exit 1
          fi
      - run: npm ci
        working-directory: mobile
      - name: Validate selected data source
        working-directory: mobile
        run: node scripts/validate-data-source.cjs
      - name: Ensure production update channel
        working-directory: mobile
        run: node scripts/ensure-update-channel.cjs
      - name: Publish compatible Android update
        working-directory: mobile
        run: node scripts/publish-update.cjs
      - name: Publish to verified pre-icon native cohort when still compatible
        working-directory: mobile
        run: node scripts/publish-legacy-update.cjs
      - name: Save verified OTA publication metadata
        uses: actions/upload-artifact@v4
        with:
          name: ota-publication-proof
          path: ${{ runner.temp }}/nabd-ota-*.json
          if-no-files-found: error
      - name: Publication summary
        run: echo 'Published to the production channel. Only OTA-enabled builds with the same native runtime fingerprint can receive this update; other users need a new APK.' >> "$GITHUB_STEP_SUMMARY"
